# Builds the Android app on every pull request (unit tests + release build, nothing published) and, on every push
# to main (a merged PR), publishes a GitHub release: the signed APK, its SHA-256, and the install instructions
# (docs/INSTALL-ANDROID.md) followed by the generated change notes.
#
# Version: name <versionName in android/app/build.gradle.kts>+build.<run number>, version code = the run number,
# so every release installs over the previous one. Bump versionName there for a new minor/major version.
#
# Signing (repository secrets, required for releases):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Every release must be signed with the same key, or it will not install over the previous one.
name: release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Version
        run: |
          base=$(grep -oP 'System.getenv\("VERSION_NAME"\) \?: "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=${base}+build.${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TAG=v${base}-build.${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APK=wall-scanner-${base}-build.${VERSION_CODE}.apk" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing (see the top of .github/workflows/release.yml)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/app-release.apk "$out/$APK"
          (cd "$out" && sha256sum "$APK" > "$APK.sha256")
          sum=$(cut -d' ' -f1 "$out/$APK.sha256")
          {
            echo "**Download:** \`$APK\` under Assets below (Android 9+, ARCore phone)."
            echo
            echo "**SHA-256:** \`$sum\`"
            echo
            sed 's/^#/##/' ../docs/INSTALL-ANDROID.md   # one heading level down, under the release title
            echo
          } > "$out/notes.md"   # --generate-notes appends "What's Changed"
          gh release create "$TAG" "$out/$APK" "$out/$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "Wall Scanner ${VERSION_NAME}" \
            --notes-file "$out/notes.md" \
            --generate-notes
